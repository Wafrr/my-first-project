<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заметки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Мои заметки</h1>
        
        <textarea id="noteInput" placeholder="Введите вашу заметку здесь..." rows="6"></textarea>
        
        <div class="buttons">
            <button id="saveBtn" class="btn save">Сохранить</button>
            <button id="clearBtn" class="btn clear">Очистить</button>
        </div>
        
        <div class="info">
            <p>Заметка автоматически сохраняется в браузере (смотреть консоль)</p>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
