<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PWA Заметки</title>

  <link rel="icon" href="./favicon.png?v=1" type="image/png">
  <link rel="icon" href="./icon.svg?v=1" type="image/svg+xml">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0071e3">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="app-header">
      <img src="icon.svg" alt="Иконка приложения" class="app-icon">
      <div>
        <h1>Заметки</h1>
        <p class="subtitle">PWA-приложение с сохранением и офлайн-режимом</p>
      </div>
    </div>

    <textarea id="noteInput" placeholder="Введите заметку..."></textarea>

    <div class="buttons">
      <button id="saveBtn">Сохранить</button>
      <button id="clearBtn">Очистить все</button>
    </div>

    <button id="checkBtn" class="check-btn">Проверить онлайн</button>

    <p id="message"></p>
    <p id="status">Статус Service Worker...</p>

    <h2>Список заметок</h2>
    <div id="notesList" class="notes-list"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
